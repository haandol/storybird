name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede older validation of the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Identify compiler and SDK
        id: toolchain
        shell: bash
        run: |
          swift --version
          xcodebuild -version
          fingerprint=$( { swift --version; xcodebuild -version; sw_vers -buildVersion; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Install MP3 fixture encoder
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          fi
          test -x /opt/homebrew/bin/ffmpeg
      - name: Build and run all Swift tests
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          # swift test builds the debug targets. AppKit/audio tests share process
          # resources, so do not add --parallel or skip tests after a cache hit.
          swift test --force-resolved-versions 2>&1 | tee build/ci/swift-tests.log
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-test-results
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Python script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements-test.txt
      - name: Run every Python suite in isolated workers
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          python scripts/run-python-tests.py --jobs 2 2>&1 | tee build/ci/python-tests.log
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-results
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7
